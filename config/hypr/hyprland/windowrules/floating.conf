# ######## Window rules — Floating / Tiling / PiP ########

# Floating

windowrule = float on, match:class ^(thunar)$, match:title ^.* Properties$
windowrule = center on, match:class ^(thunar)$, match:title ^.* Properties$
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = size 205 144, match:class ^(org.gnome.Calculator)$
windowrule = move 67 200, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(io.missioncenter.MissionCenter)$
windowrule = size 793 526, match:class ^(io.missioncenter.MissionCenter)$
windowrule = move 33 33, match:class ^(io.missioncenter.MissionCenter)$
windowrule = center on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Open File)(.*)$
windowrule = center on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = center on, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, match:title ^(Choose wallpaper)(.*)$
windowrule = size 1536 936, match:title ^(Choose wallpaper)(.*)$
windowrule = center on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = center on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = center on, match:title ^(Library)(.*)$
windowrule = float on, match:title ^(Library)(.*)$
windowrule = center on, match:title ^(File Upload)(.*)$
windowrule = float on, match:title ^(File Upload)(.*)$
windowrule = center on, match:title ^(.*)(wants to save)$
windowrule = float on, match:title ^(.*)(wants to save)$
windowrule = center on, match:title ^(.*)(wants to open)$
windowrule = float on, match:title ^(.*)(wants to open)$
windowrule = float on, match:class ^(blueberry\.py)$
windowrule = float on, match:class ^(guifetch)$   # FlafyDev/guifetch
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 837 747, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 837 747, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = size 1152 864, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class .*plasmawindowed.*
windowrule = float on, match:class kcm_.*
windowrule = float on, match:class .*bluedevilwizard
windowrule = float on, match:title .*Welcome
windowrule = float on, match:title ^(illogical-impulse Settings)$
# windowrulev2 = float, title:.*Shell conflicts.*
windowrule = float on, match:class org.freedesktop.impl.portal.desktop.kde
windowrule = size 1536 936, match:class org.freedesktop.impl.portal.desktop.kde
windowrule = float on, match:class ^(Zotero)$
windowrule = size 1152 1152, match:class ^(Zotero)$
windowrule = float on, match:class ^(imv)$
windowrule = size 2509 1411, match:class ^(imv)$
windowrule = center on, match:class ^(imv)$
windowrule = float on, match:class ^(imv-dir)$
windowrule = size 2509 1411, match:class ^(imv-dir)$
windowrule = center on, match:class ^(imv-dir)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 1152 864, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(thunar)$
windowrule = size 1152 864, match:class ^(thunar)$
windowrule = center on, match:class ^(thunar)$
windowrule = float on, match:class ^(Thunar)$
windowrule = size 1152 864, match:class ^(Thunar)$
windowrule = center on, match:class ^(Thunar)$
windowrule = float on, match:class ^(jarvis.py)$
windowrule = size 400 200, match:class ^(jarvis.py)$
windowrule = center on, match:class ^(jarvis.py)$

# Move
# kde-material-you-colors spawns a window when changing dark/light theme. This is to make sure it doesn't interfere at all.
windowrule = float on, match:class ^(plasma-changeicons)$
windowrule = no_initial_focus on, match:class ^(plasma-changeicons)$
windowrule = move 999999 999999, match:class ^(plasma-changeicons)$
# stupid dolphin copy
windowrule = move 27 53, match:title ^(Copying — Dolphin)$

# Tiling
windowrule = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keep_aspect_ratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = move 1869 1037, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size 717 403, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# --- Tearing ---
# windowrulev2 = immediate, title:.*\.exe
# windowrulev2 = immediate, title:.*minecraft.*
# windowrulev2 = immediate, class:^(steam_app).*

# No shadow for tiled windows (matches windows that are not floating).
windowrule = no_shadow on, match:float 0

# Regra específica para a Biblioteca do Firefox
windowrule = float on, match:class ^(org.mozilla.firefox)$, match:title ^(Biblioteca)$
windowrule = center on, match:class ^(org.mozilla.firefox)$, match:title ^(Biblioteca)$
windowrule = size 768 432, match:class ^(org.mozilla.firefox)$, match:title ^(Biblioteca)$