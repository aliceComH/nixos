font_family      JetBrainsMono Nerd Font Mono Regular
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono SemiBold Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic

font_size 12.0
hide_window_decorations yes
confirm_os_window_close 0
window_padding_width 20

include ./themes/meowrch.conf

# Não lembrar tamanho/estado da última janela: o kitty gravava "maximized" em
# ~/.cache/kitty/main.json e reabria tudo maximizado. O tamanho real vem das
# windowrules do Hyprland (config/hypr/hyprland/windowrules/floating.lua).
remember_window_size no
initial_window_width  1004
initial_window_height 822
