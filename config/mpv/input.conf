# ── Atalhos de Interpolação ───────────────────────────────────────────────────
# Ctrl+R       → RIFE (GPU, Deep Learning via Vulkan) — modelo rife-v4.26-lite
# Ctrl+G       → Vetorial (MVTools/CPU, estilo SVP)
# Ctrl+Shift+I → Desliga interpolação por completo
ctrl+r       apply-profile interp-rife; show-text "Interpolação ON (RIFE/GPU via Vulkan)"
ctrl+g       apply-profile interp-vector; show-text "Interpolação ON (Vetorial/MVTools adaptativo)"
ctrl+I       change-list vf clr ""; set video-sync audio; set hwdec auto-safe; set display-fps-override 0; show-text "Interpolação OFF"
