# ── Base ──────────────────────────────────────────────────────────────────────
profile=interp-rife
video-sync=audio
hwdec=auto-safe
keep-open=yes

# ── Perfil: RIFE (GPU, Deep Learning via Vulkan) ─────────────────────────────
[interp-rife]
hwdec=no
vf=vapoursynth=~/.config/mpv/filters/interpolation-rife.vpy:buffered-frames=4:concurrent-frames=4
video-sync=display-resample
hr-seek-framedrop=no
audio-buffer=1.0
video-sync-max-video-change=5
audio-pitch-correction=no

# ── Perfil: Interpolação vetorial (MVTools, estilo SVP) ──────────────────────
[interp-vector]
hwdec=auto-copy
vf=vapoursynth=~/.config/mpv/filters/interpolation.vpy:buffered-frames=4:concurrent-frames=4
video-sync=display-resample
hr-seek-framedrop=no
audio-buffer=1.0
video-sync-max-video-change=5
audio-pitch-correction=no
