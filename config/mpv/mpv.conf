# ── Base ──────────────────────────────────────────────────────────────────────
# profile=interp-vector (Carregamento movido para o script delay-interp.lua para evitar crash inicial)
video-sync=display-resample
keep-open=yes

# ── Perfil: RIFE (GPU, Deep Learning via Vulkan) ─────────────────────────────
[interp-rife]
hwdec=vaapi-copy
vf=vapoursynth=~/.config/mpv/filters/interpolation-rife.vpy:buffered-frames=12:concurrent-frames=8
hr-seek-framedrop=yes
audio-buffer=2.0
video-sync-max-video-change=5

# ── Perfil: Interpolação vetorial (MVTools, estilo SVP) ──────────────────────
[interp-vector]
hwdec=no
vf=vapoursynth=~/.config/mpv/filters/interpolation.vpy:buffered-frames=4:concurrent-frames=16
video-sync=display-resample
hr-seek-framedrop=no
audio-buffer=1.0
video-sync-max-video-change=5
audio-pitch-correction=no
