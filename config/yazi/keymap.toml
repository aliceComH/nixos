# Yazi — keybindings customizados
# Docs: https://yazi-rs.github.io/docs/configuration/keymap

[[manager.prepend_keymap]]
on   = ["<Enter>"]
run  = "plugin smart-enter"
desc = "Enter: abre arquivo ou entra no diretório"

[[manager.prepend_keymap]]
on   = ["g", "d"]
run  = "cd ~/Downloads"
desc = "Ir para Downloads"

[[manager.prepend_keymap]]
on   = ["g", "p"]
run  = "cd ~/Projetos"
desc = "Ir para Projetos"

[[manager.prepend_keymap]]
on   = ["g", "c"]
run  = "cd /etc/nixos"
desc = "Ir para configuração NixOS"

[[manager.prepend_keymap]]
on   = ["g", "w"]
run  = "cd /etc/nixos/wallpapers"
desc = "Ir para wallpapers"

# Bulk rename com $EDITOR
[[manager.prepend_keymap]]
on   = ["b", "r"]
run  = "plugin bulk-rename"
desc = "Renomear arquivos em lote"

# Abrir terminal no diretório atual
[[manager.prepend_keymap]]
on   = ["T"]
run  = '''shell 'kitty --detach --directory "$PWD"' --confirm'''
desc = "Abrir Kitty no diretório atual"

# Chmod rápido
[[manager.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Alterar permissões"

# Diff de dois arquivos selecionados
[[manager.prepend_keymap]]
on   = ["d", "f"]
run  = "plugin diff"
desc = "Diff de arquivos selecionados"

# Movimentos relativos (vim-style: 5j, 10k)
[[manager.prepend_keymap]]
on   = ["1"]
run  = "plugin relative-motions --args=1"
desc = "Mover 1 linha"

[[manager.prepend_keymap]]
on   = ["2"]
run  = "plugin relative-motions --args=2"
desc = "Mover 2 linhas"

[[manager.prepend_keymap]]
on   = ["3"]
run  = "plugin relative-motions --args=3"
desc = "Mover 3 linhas"

[[manager.prepend_keymap]]
on   = ["4"]
run  = "plugin relative-motions --args=4"
desc = "Mover 4 linhas"

[[manager.prepend_keymap]]
on   = ["5"]
run  = "plugin relative-motions --args=5"
desc = "Mover 5 linhas"

[[manager.prepend_keymap]]
on   = ["6"]
run  = "plugin relative-motions --args=6"
desc = "Mover 6 linhas"

[[manager.prepend_keymap]]
on   = ["7"]
run  = "plugin relative-motions --args=7"
desc = "Mover 7 linhas"

[[manager.prepend_keymap]]
on   = ["8"]
run  = "plugin relative-motions --args=8"
desc = "Mover 8 linhas"

[[manager.prepend_keymap]]
on   = ["9"]
run  = "plugin relative-motions --args=9"
desc = "Mover 9 linhas"
