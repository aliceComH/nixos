# Yazi — tema customizado
# Baseado no tema padrão com ajustes para combinar com o setup dark/transparente

[status]
separator_open  = ""
separator_close = ""

[filetype]
rules = [
  # Imagens
  { mime = "image/*", fg = "#8aadf4" },
  # Vídeos
  { mime = "video/*", fg = "#f5a97f" },
  # Áudio
  { mime = "audio/*", fg = "#f5a97f" },
  # Arquivos compactados
  { mime = "application/*zip*", fg = "#eed49f" },
  { mime = "application/x-tar", fg = "#eed49f" },
  { mime = "application/x-7z*", fg = "#eed49f" },
  { mime = "application/x-rar*", fg = "#eed49f" },
  # Documentos
  { mime = "application/pdf", fg = "#ed8796" },
  { mime = "text/*", fg = "#cad3f5" },
  # Executáveis
  { name = "*.sh", fg = "#a6da95" },
  { name = "*.nix", fg = "#8aadf4" },
  { name = "*.lua", fg = "#b7bdf8" },
  { name = "*.py", fg = "#eed49f" },
  { name = "*.rs", fg = "#f5a97f" },
  { name = "*.go", fg = "#8bd5ca" },
]
